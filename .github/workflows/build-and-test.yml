name: build-and-test

# Sandy's online workshop: build the APK from this repo's own manual
# aapt2 chain (build.sh), run the V180Test desktop unit harness, then
# boot an emulator, install the APK, and prove the app actually launches.
# A green run means: built + unit checks passed + app ran on a device.

on:
  push:
    branches: [main]
    # The linkcheck bot commits to ci/linkcheck/ every 2h on its own
    # schedule — those freshness updates must not burn a full APK
    # build + emulator launch each time.
    paths-ignore: ['ci/linkcheck/**']
  workflow_dispatch:

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The action's default package list asks sdkmanager for the
        # legacy 'tools' package, which Google retired from the SDK
        # repository — every run died here in ~20s on 2026-10-23
        # ("Failed to find package 'tools'"). platform-tools is all
        # this step needs to provide; the next step installs the
        # exact platform + build-tools itself.
        with:
          packages: platform-tools

      - name: Install platform 34 + build-tools 34.0.0
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Recreate the local build layout build.sh expects
        run: |
          mkdir -p "$HOME/workspace/apk_build"
          ln -sfn "$JAVA_HOME" "$HOME/workspace/apk_build/jdk-17.0.11+9"
          ln -sfn "$ANDROID_SDK_ROOT" "$HOME/workspace/apk_build/android-sdk"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/workspace/tala-tv-2026-10-16"
          ls -la "$HOME/workspace" "$HOME/workspace/apk_build"

      - name: Restore PNG resources from base64
        run: bash ci/restore_binaries.sh

      - name: Fetch dependency closure (work/maven + test jars)
        run: python3 ci/fetch_deps.py

      - name: Build the APK (project's own build.sh)
        run: |
          cd "$HOME/workspace/tala-tv-2026-10-16"
          bash build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ci-out-build.log"
          ls -la build/*.apk
        shell: bash

      - name: Run V180Test unit harness (2,319 checks)
        run: bash ci/run_v180test.sh

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp build/*.apk out/ 2>/dev/null || true
          cp ci-out/v180test.log out/ 2>/dev/null || true
          cp ci-out-build.log out/ 2>/dev/null || true
          ls -la out/

      - name: Upload APK + unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandy-apk-and-unit
          path: out/
          if-no-files-found: warn

  emulator-launch:
    needs: build-and-unit
         # Ubuntu + KVM, not macos-14: on 2026-10-23 the macOS arm64
    # emulator never finished booting (adb daemon unreachable,)
    # 600s boot timeout) and the app was never even installed.
    # The KVM route on Ubuntu runners is the well-trodden one.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL==""kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: sandy-apk-and-unit
          path: dl

      - name: Boot emulator, install, launch, verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          # One line on purpose: this action runs each script line as
          # a separate sh -c, so variables die between lines (runs #9
          # and #10, 2026-10-23). The real check lives in one file
          # that runs in a single shell: ci/emulator_verify.sh.
          script: bash "$GITHUB_WORKSPACE/ci/emulator_verify.sh"
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandy-emulator-evidence
          path: emu-out/
          if-no-files-found: warn
